# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# NOTE: -Dfile.encoding=GBK makes Gradle write worker @argfiles in GBK so the
# worker JVM (sun.jnu.encoding=GBK on this Chinese-locale Windows box) can read
# the Chinese project paths in them. UTF-8 argfiles + GBK reader = garbage paths.
org.gradle.jvmargs=-Xmx4G -Djava.net.preferIPv4Stack=true -Dfile.encoding=GBK
org.gradle.configuration-cache=true

# Use the full JDK 21 (has javac) instead of the bundled JRE - NeoForm's
# recompile step requires a real Java compiler.
org.gradle.java.home=C:\\Program Files\\Java\\jdk-21

# Force IPv4 for Gradle HTTP downloads (avoids IPv6 route issues)
systemProp.java.net.preferIPv4Stack=true

mod_version=1.0.0
minecraft_version=1.21.1
# Match the NeoForge version used by the game (poke.json: --fml.neoForgeVersion 21.1.248)
neo_version=21.1.248
loader_version_range=[4,)
minecraft_version_range=[1.21.1]

# Parchment settings
neoForge.parchment.minecraftVersion=1.21.1
neoForge.parchment.mappingsVersion=2024.11.17
